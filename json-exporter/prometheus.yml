scrape_configs:

  ## gather metrics of prometheus itself
- job_name: prometheus
  static_configs:
    - targets:
      - prometheus.default.svc:9090 # equivalent to "localhost:9090"

  ## gather the metrics of json_exporter application itself
- job_name: json_exporter
  static_configs:
    - targets:
      ## Location of the json exporter's real <hostname>:<port>
      - json-exporter-prometheus-json-exporter.default.svc:7979

  ## gather the metrics from third party json sources, via the json exporter
- job_name: json
  metrics_path: /probe
  params:
    module: [default]
  static_configs:
    - targets:
      - http://host.docker.internal:8000/examples/data.json
  relabel_configs:
    - source_labels: [__address__]
      target_label: __param_target
    - source_labels: [__param_target]
      target_label: instance
    - target_label: __address__
      ## Location of the json exporter's real <hostname>:<port>
      replacement: json-exporter-prometheus-json-exporter:7979

- job_name: abc
  metrics_path: /probe
  params:
    module: [abc]
  static_configs:
    - targets:
      - https://abc.sr.se/api/health
  relabel_configs:
    - source_labels: [__address__]
      target_label: __param_target
    - source_labels: [__param_target]
      target_label: instance
    - target_label: __address__
      ## Location of the json exporter's real <hostname>:<port>
      replacement: json-exporter-prometheus-json-exporter:7979

