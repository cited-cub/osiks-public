apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: prometheus
  name: prometheus
spec:
  containers:
  - image: prom/prometheus
    name: prometheus
    ports:
    - containerPort: 9090
    resources: {}
    volumeMounts:
      - name: config-volume
        mountPath: /etc/prometheus
  volumes:
    - name: config-volume
      configMap:
        name: prometheus
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
