apiVersion: v1
kind: Pod
metadata:
  creationTimestamp: null
  labels:
    run: prometheus
  name: prometheus
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
  - image: quay.io/prometheus/prometheus
    name: prometheus
    volumeMounts:
      - name: config-volume
        mountPath: /etc/prometheus
    resources: {}
  volumes:
    - name: config-volume
      configMap:
        name: prometheus
  dnsPolicy: ClusterFirst
  restartPolicy: Always
status: {}
