kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30000
    hostPort: 30000
    listenAddress: "0.0.0.0"
    protocol: tcp
  - containerPort: 30010
    hostPort: 30010
  - containerPort: 30020
    hostPort: 30020
  - containerPort: 30030
    hostPort: 30030
  - containerPort: 30040
    hostPort: 30040
- role: worker
  extraPortMappings:
  - containerPort: 80
    hostPort: 8180
  - containerPort: 30010
    hostPort: 8190
- role: worker
- role: worker
networking:
#  disableDefaultCNI: true
